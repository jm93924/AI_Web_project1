<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{url_for('static', filename='bootstrap.min.css') }}">
</head>
<body>

<div class="container my-5">
    <div class="mx-auto p-4 p-md-5 border rounded-0 bg-white" style="max-width: 850px;">

        <!-- 제목 -->
        <div class="text-center mb-5">
            <h1 class="fw-bold mb-4">로그인</h1>
            <p class="fs-4 mb-0">계정에 로그인하여 서비스를 이용하세요</p>
        </div>

        <!-- 로그인 폼 -->
        <form method="post" action="{{url_for('login.sign_in')}}">
            <div class="mb-4">
                <label for="username" class="form-label fs-3">아이디</label>
                <input type="text"
                       class="form-control form-control-lg rounded-4 py-3"
                       id="username"
                       name="username"
                       placeholder="example@email.com">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fs-3">비밀번호</label>
                <input type="password"
                       class="form-control form-control-lg rounded-4 py-3"
                       id="password"
                       name="password"
                       placeholder="••••••••">
            </div>

            <div class="d-grid mb-5">
                <button type="submit" class="btn btn-lg rounded-3 py-3" style="background-color:#cfe8f3;">
                    로그인
                </button>
            </div>
        </form>

        <!-- 구분선 -->
        <div class="d-flex align-items-center my-5">
            <hr class="flex-grow-1">
            <span class="mx-3 fs-4">또는 간편 로그인</span>
            <hr class="flex-grow-1">
        </div>

        <!-- 간편 로그인 -->
        <div class="d-grid gap-3 mb-5">
            <a href="#"
               class="btn btn-lg rounded-3 py-3 border-0"
               style="background-color:#69c34f; color:#111;">
                네이버로 시작하기
            </a>

            <a href="#"
               class="btn btn-lg rounded-3 py-3 border-0"
               style="background-color:#f2df4a; color:#111;">
                카카오로 시작하기
            </a>

            <a href="#"
               class="btn btn-lg rounded-3 py-3 bg-white border"
               style="color:#111;">
                구글로 시작하기
            </a>
        </div>

        <!-- 하단 링크 -->
        <div class="text-center">
            <p class="mb-3 fs-4">
                계정이 없으신가요?
                <a href="#" class="text-decoration-none text-secondary">회원가입</a>
            </p>

            <a href="{{ url_for('main.index') }}"
               class="text-decoration-none text-dark fs-4">
                메인으로 돌아가기
            </a>
        </div>

    </div>
</div>

</body>
</html>
